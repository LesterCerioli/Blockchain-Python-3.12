services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # Creates two databases on first boot via scripts/docker-init/00_init.sh:
  #   - fastchainbank  (Ethereum service)
  #   - cryptobank     (DeFi service)
  # All credentials and ports are read from environment variables (.env).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/docker-init:/docker-entrypoint-initdb.d:ro,z
      - ./migrations:/migrations:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blockchain-net

  # ---------------------------------------------------------------------------
  # Redis 7
  # Used by the DeFi service for quote/history caching.
  # Authentication is enabled via REDIS_PASSWORD; the host port comes from
  # REDIS_PORT. The password value lives only in .env / the deployment secret
  # store — never in this file.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --appendonly yes --loglevel notice --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blockchain-net

  # ---------------------------------------------------------------------------
  # Geth (go-ethereum) — local Ethereum node in dev mode
  # chain-id 1337 (Geth dev default), block-time 2 s
  # HTTP-RPC host port: ${ETH_RPC_PORT} | container port: 8545
  # ---------------------------------------------------------------------------
  eth-node:
    image: ethereum/client-go:stable
    restart: unless-stopped
    command: >
      --dev
      --dev.period 2
      --http
      --http.addr 0.0.0.0
      --http.port 8545
      --http.api eth,net,web3,debug,txpool
      --http.corsdomain *
      --http.vhosts *
    ports:
      - "${ETH_RPC_PORT}:8545"
    volumes:
      - eth_data:/root/.ethereum
    healthcheck:
      test: ["CMD-SHELL", "geth attach --exec eth.blockNumber http://localhost:8545 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blockchain-net

  # ---------------------------------------------------------------------------
  # Bitcoin Core — local Bitcoin node (regtest)
  # RPC host port: ${BTC_RPC_PORT} | container port: 18443
  # P2P host port: ${BTC_P2P_PORT} | container port: 18444
  # RPC credentials are read from BTC_RPC_USER / BTC_RPC_PASSWORD.
  # ---------------------------------------------------------------------------
  bitcoind:
    image: ruimarinho/bitcoin-core:latest
    restart: unless-stopped
    command: >
      -regtest=1
      -rpcallowip=0.0.0.0/0
      -rpcbind=0.0.0.0
      -rpcport=18443
      -port=18444
      -rpcuser=${BTC_RPC_USER}
      -rpcpassword=${BTC_RPC_PASSWORD}
      -txindex=1
      -fallbackfee=0.0001
      -printtoconsole=1
    ports:
      - "${BTC_RPC_PORT}:18443"
      - "${BTC_P2P_PORT}:18444"
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=${BTC_RPC_USER} -rpcpassword=${BTC_RPC_PASSWORD} getblockchaininfo > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - blockchain-net

volumes:
  postgres_data:
  redis_data:
  eth_data:
  bitcoin_data:

networks:
  blockchain-net:
    driver: bridge
